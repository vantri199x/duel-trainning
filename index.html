<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duel Training – Yu-Gi-Oh PPL Upper Lower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#07060f; --card:#12102a; --line:#4a3d1c; --text:#f4ecd6; --mute:#a99f84; --gold:#e8b94a; --gold2:#ffe49a; --c:#e8b94a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; font-family:'Exo 2','Exo',system-ui,sans-serif; color:var(--text); background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%, color-mix(in srgb,var(--c) 28%,transparent), transparent 60%),
    linear-gradient(135deg,rgba(232,185,74,.05) 25%,transparent 25% 50%,rgba(232,185,74,.05) 50% 75%,transparent 75%);
  background-size:auto,36px 36px; background-attachment:fixed;
}
h1,h2,h3{margin:0; font-weight:900}
.hero{text-align:center; padding:1.6rem .8rem .6rem}
.hand{display:flex; justify-content:center; align-items:flex-end; height:clamp(150px,34vw,250px)}
.hc{width:clamp(80px,19vw,150px); margin:0 -.9rem; border-radius:6px; cursor:pointer; box-shadow:0 8px 24px #000a; transform:rotate(var(--r)) translateY(var(--y)); transition:transform .25s}
.hc:hover{transform:rotate(0) translateY(-16px) scale(1.1); z-index:5}
.hero h1{
  margin-top:1rem; font-size:clamp(1.9rem,8vw,3.8rem); letter-spacing:.1em; text-transform:uppercase; line-height:1;
  background:linear-gradient(180deg,#fff6cf,var(--gold) 50%,#8a5d12); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 0 #2b1a00) drop-shadow(0 0 14px rgba(232,185,74,.45));
}
.hero p{color:var(--mute); margin:.5rem 0 0; font-weight:600}
.hud{max-width:620px; margin:1.1rem auto 0; padding:.7rem .9rem; border:2px solid var(--line); border-radius:8px; background:#0c0a1dcc}
.lp{display:flex; justify-content:space-between; font-weight:900; letter-spacing:.05em; color:var(--gold2)}
.bar{height:12px; margin:.35rem 0 .7rem; background:#000; border:2px solid var(--line); border-radius:3px; overflow:hidden}
.bar i{display:block; height:100%; width:0; transition:width .5s; background:linear-gradient(90deg,#8a5d12,var(--gold),var(--gold2))}
.pieces{display:grid; grid-template-columns:repeat(5,1fr); gap:.4rem}
.pc{padding:.35rem 0; font-size:.72rem; font-weight:800; color:#5d543c; border:2px solid #2a2415; border-radius:4px; background:#0a0817; transition:.4s}
.pc.on{color:#2b1a00; background:linear-gradient(#ffe49a,#e8b94a); border-color:#fff1bd; box-shadow:0 0 14px #e8b94a}
.days{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:.4rem; max-width:700px; margin:1.3rem auto 0; padding:0 .7rem}
.day{position:relative; aspect-ratio:3/4; padding:0; overflow:hidden; border:2px solid var(--line); border-radius:6px; background:#000; color:#fff; font:inherit; cursor:pointer; transition:.2s}
.day img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top; opacity:.4; transition:.2s}
.day span{position:absolute; left:0; right:0; bottom:0; padding:.3rem 0 .2rem; background:linear-gradient(transparent,#000d); font-weight:900; font-size:.82rem; line-height:1.05}
.day small{display:block; font-size:.55rem; font-weight:600}
.day.sel{border-color:var(--c); box-shadow:0 0 18px var(--c); transform:translateY(-5px)}
.day.sel img{opacity:1}
.day.today::after{content:"★"; position:absolute; top:1px; right:4px; color:var(--gold2); font-size:.8rem}
.day:focus-visible,.ex:focus-within,.tg button:focus-visible{outline:3px solid var(--gold2); outline-offset:2px}
main{max-width:980px; margin:1.4rem auto 2rem; padding:0 .9rem}
.duel{display:grid; grid-template-columns:260px 1fr; gap:1.2rem; align-items:start}
aside{text-align:center; position:sticky; top:1rem}
.big{width:100%; border-radius:8px; box-shadow:0 0 34px color-mix(in srgb,var(--c) 70%,transparent), 0 10px 30px #000a}
.tg{display:flex; justify-content:center; gap:.4rem; margin-top:.7rem}
.tg button{font:inherit; font-weight:800; padding:.25rem .9rem; border-radius:99px; border:2px solid var(--line); background:#0c0a1d; color:var(--mute); cursor:pointer}
.tg button.on{background:var(--c); color:#12102a; border-color:var(--c)}
.cap{margin-top:.4rem; font-weight:800; color:var(--gold2)}
.banner{padding:.9rem 1.1rem; margin-bottom:.9rem; border:2px solid var(--c); border-radius:8px; background:linear-gradient(120deg,color-mix(in srgb,var(--c) 30%,#12102a),#0d0b1c); box-shadow:inset 0 0 0 3px #0d0b1c, inset 0 0 0 4px color-mix(in srgb,var(--c) 50%,transparent)}
.banner h2{font-size:clamp(1.5rem,5vw,2.2rem); text-transform:uppercase; color:var(--c); letter-spacing:.04em}
.banner p{margin:.15rem 0 0; font-weight:600; color:var(--text)}
.ex{display:flex; gap:.8rem; align-items:center; margin-bottom:.5rem; padding:.7rem .85rem; cursor:pointer; background:var(--card); border:2px solid var(--line); border-left:6px solid var(--c); border-radius:6px; transition:.2s}
.ex input{position:absolute; opacity:0}
.chk{flex:none; width:28px; height:28px; display:grid; place-items:center; border:2px solid var(--mute); border-radius:4px; transform:rotate(45deg); color:transparent; font-weight:900; transition:.2s}
.chk b{transform:rotate(-45deg)}
.ex.done{opacity:.6; border-color:var(--gold); border-left-color:var(--gold)}
.ex.done .chk{background:var(--gold); border-color:var(--gold2); color:#2b1a00; box-shadow:0 0 12px var(--gold)}
.ex.done .nm{text-decoration:line-through}
.nm{font-weight:800; font-size:1.05rem}
.meta{display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.3rem}
.tag{font-size:.76rem; font-weight:800; padding:.1rem .55rem; border-radius:3px; background:#07060f; border:1px solid var(--line); color:var(--gold2)}
.tag.atk{color:#ff8a7a; border-color:#6b2a22} .tag.def{color:#8fd0ff; border-color:#22456b}
.cardio{border-left-color:#5ee6a8}
.note{margin-top:.8rem; padding:.7rem .9rem; font-weight:600; border:2px dashed var(--c); border-radius:6px; background:#ffffff08}
.win{text-align:center; margin:1rem 0; font-weight:900; font-size:1.25rem; color:var(--gold2); text-shadow:0 0 14px var(--gold)}
.btn{display:block; margin:1rem auto 0; padding:.4rem .9rem; font:inherit; font-weight:700; color:var(--mute); background:none; border:2px solid var(--line); border-radius:6px; cursor:pointer}
.btn:hover{color:var(--text); border-color:var(--gold)}
.colh{max-width:980px; margin:0 auto; padding:0 .9rem; font-size:1.4rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold)}
.col{display:grid; grid-template-columns:repeat(4,1fr); gap:.8rem; max-width:980px; margin:.8rem auto 4rem; padding:0 .9rem}
.col figure{margin:0; text-align:center; font-size:.72rem; font-weight:700; color:var(--mute); cursor:pointer}
.col img{width:100%; border-radius:5px; box-shadow:0 5px 16px #000a; transition:transform .2s}
.col figure:hover img{transform:translateY(-6px)}
@media (max-width:720px){ .duel{grid-template-columns:1fr} aside{position:static} .big{width:min(260px,70vw)} .col{grid-template-columns:repeat(2,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="hand" id="hand"></div>
  <h1>Duel Training</h1>
  <p>PPL – Upper – Lower · It’s time to d-d-d-duel!</p>
  <div class="hud">
    <div class="lp"><span>LP</span><span id="lp">0 / 8000</span></div>
    <div class="bar" role="progressbar" aria-label="Tiến độ buổi tập"><i id="fill"></i></div>
    <div class="pieces" id="pieces" aria-hidden="true"></div>
  </div>
</header>
<nav class="days" id="days" aria-label="Chọn ngày tập"></nav>
<main id="view"></main>
<h2 class="colh">Bộ sưu tập</h2>
<div class="col" id="col"></div>

  ["Cable lateral raise","2 set","12–15","1 RIR"],["Reverse pec dec (vai sau)","2 set","12–15","1 RIR"],["Standing calf raise","3 set","10–12","1 RIR"],
  ["Seated calf raise","2 set","12–15",""],["Wrist curl","2 set","12–15",""],["Reverse curl","2 set","10–12",""],["Cable crunch","2 set","15",""]]},
 {k:"T6",f:"Thứ Sáu",n:"Upper",s:"Blue-Eyes White Dragon – Thân trên",c:"#4cc9ff",id:"upper",card:"bewd",v:1,ex:[
  ["Incline chest press","2 set","6–8","1 RIR"],["Pec dec","1 set","đến fail",""],["Chest supported row","2 set","10–12","1 RIR"],["Lat pull down","2 set","10–12",""],
  ["Triceps extension","2 set","10–12","2 RIR"],["Preacher curl","2 set","8–10",""],["Bayesian curl","1 set fail + 1 set","8–10",""],
  ["Behind lateral raise","1 set","đến fail",""],["Shoulder press","2 set","6–8",""]]},
 {k:"T7",f:"Thứ Bảy",n:"Lower",s:"Exodia the Obliterator – Thân dưới",c:"#ff8a3d",id:"lower",card:"exo",v:1,ex:[
  ["Leg extension","2 set","10–12",""],["Adductor","2 set","15",""],["Pendulum squats","2 set","6–8",""],["Leg press","2 set","12",""],
  ["Leg curl","2 set","10",""],["RDL","2 set","10",""],["Cable crunch","2 set","15",""],["Cardio","20 phút","","",1]]},
 {k:"CN",f:"Chủ Nhật",n:"Cơ yếu",s:"Dark Magician – Bụng, trap, bắp chân",c:"#9b6bff",id:"weakB",card:"dm",v:1,note:"Càng chịu đòn càng mạnh. Hãy tăng dần độ khó mỗi tuần.",ex:[
  ["Hanging leg raise","2 set","12–15","1 RIR"],["Ab wheel","2 set","10–12",""],["Dumbbell shrug","2 set","10–12","1 RIR"],

];
const ORDER=[1,2,3,4,5,6,0], today=ORDER.indexOf(new Date().getDay());
const $=s=>document.querySelector(s), KEY="dbz-workout-v1";
let sel=today, state={}, ver=D.map(d=>d.v);
try{ state=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} };

function tabs(){
  $("#days").innerHTML=D.map((d,i)=>`<button class="day ${i===sel?"sel":""} ${i===today?"today":""}" style="--c:${d.c}" data-i="${i}" aria-pressed="${i===sel}"><img src="${IMG[d.card][ver[i]]}" alt=""><span>${d.k}<small>${d.n}</small></span></button>`).join("");
  document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{sel=+b.dataset.i; render();});
}
function render(){
  const d=D[sel];
  document.documentElement.style.setProperty("--c",d.c);
  tabs();
  let h=`<div class="duel"><aside><img class="big" src="${IMG[d.card][ver[sel]]}" alt="${NM[d.card][ver[sel]]}">
    <div class="tg"><button data-v="0" class="${ver[sel]===0?"on":""}">TCG</button><button data-v="1" class="${ver[sel]===1?"on":""}">OCG</button></div>
    <div class="cap">${NM[d.card][ver[sel]]}</div></aside><section>
    <div class="banner"><h2>${d.f} – ${d.n}</h2><p>${d.s}</p></div>`;
  d.ex.forEach((e,i)=>{
    const id=d.id+i, on=!!state[id];
    h+=`<label class="ex ${on?"done":""} ${e[4]?"cardio":""}"><input type="checkbox" data-id="${id}" ${on?"checked":""}><span class="chk"><b>✓</b></span>
      <span><div class="nm">${e[0]}</div><div class="meta"><span class="tag">${e[1]}</span>${e[2]?`<span class="tag atk">ATK ${e[2]}</span>`:""}${e[3]?`<span class="tag def">DEF ${e[3]}</span>`:""}</div></span></label>`;
  });
  if(d.note) h+=`<div class="note">${d.note}</div>`;
  h+=`<div id="msg"></div><button class="btn" id="reset">Làm mới buổi tập</button></section></div>`;
  $("#view").innerHTML=h;
  document.querySelectorAll(".tg button").forEach(b=>b.onclick=()=>{ver[sel]=+b.dataset.v; render();});
  document.querySelectorAll(".ex input").forEach(c=>c.onchange=()=>{
    if(c.checked) state[c.dataset.id]=true; else delete state[c.dataset.id];
    save(); c.closest(".ex").classList.toggle("done",c.checked); power();
  });
  $("#reset").onclick=()=>{ d.ex.forEach((_,i)=>delete state[d.id+i]); save(); render(); };
  power();
}
function power(){
  const d=D[sel], t=d.ex.length, n=d.ex.filter((_,i)=>state[d.id+i]).length, p=t?n/t:0;
  $("#lp").textContent=Math.round(p*8000)+" / 8000";
  $("#fill").style.width=Math.round(p*100)+"%";
  const lit=Math.floor(p*5+1e-9);
  $("#pieces").innerHTML=["Đầu","Tay trái","Tay phải","Chân trái","Chân phải"].map((x,i)=>`<div class="pc ${i<lit?"on":""}">${x}</div>`).join("");
  $("#msg").innerHTML=(t&&n===t)?`<div class="win">✦ Đủ 5 mảnh Exodia – Obliterate! Bạn thắng trận hôm nay ✦</div>`:"";
}
$("#hand").innerHTML=[["bewd",-11,14],["dm",-4,2],["dmg",4,2],["exo",11,14]].map(([k,r,y])=>`<img class="hc" style="--r:${r}deg;--y:${y}px" src="${IMG[k][0]}" alt="${NM[k][0]}">`).join("");
document.querySelectorAll(".hc").forEach((el,i)=>el.onclick=()=>{const k=["bewd","dm","dmg","exo"][i]; const j=D.findIndex(d=>d.card===k); sel=j; ver[j]=0; render(); scrollTo({top:0,behavior:"smooth"});});
const items=[];
Object.keys(IMG).forEach(k=>[0,1].forEach(v=>items.push([k,v])));
$("#col").innerHTML=items.map(([k,v])=>`<figure data-k="${k}" data-v="${v}"><img src="${IMG[k][v]}" alt="${NM[k][v]}">${NM[k][v]} · ${v?"OCG":"TCG"}</figure>`).join("");
document.querySelectorAll(".col figure").forEach(f=>f.onclick=()=>{const j=D.findIndex(d=>d.card===f.dataset.k); sel=j; ver[j]=+f.dataset.v; render(); scrollTo({top:0,behavior:"smooth"});});
render();
</script>
